[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-personalization"
version = "1.0.0"
description = "Deterministic B2B cold-email research and copy engine (no LLM) with a localhost web app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["lead_personalization"]

[tool.setuptools.package-data]
lead_personalization = ["render_page.js", "offer_packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
