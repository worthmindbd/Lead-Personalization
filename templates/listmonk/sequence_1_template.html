<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Subscriber.Attribs.email_1_subject }}{{ .Subscriber.Attribs.email_1_subject }}{{ else }}video finishing{{ end }}</title>
</head>
<!--
  Cold email, sequence step 1. Deliberately plain: no logo, card, canvas, hidden
  text, or tracking pixel. A cold email should look like one person writing to
  another; marketing-style HTML and hidden blocks are spam signals.
-->
<body style="margin: 0; padding: 16px; background-color: #ffffff;">
  <div style="max-width: 600px; font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.5; color: #222222;">
    <div class="email-content" style="white-space: pre-line;">{{ if .Subscriber.Attribs.email_1_body }}{{ .Subscriber.Attribs.email_1_body }}{{ else }}{{ template "content" . }}{{ end }}</div>

    <p style="margin: 20px 0 0 0;">Best regards,<br>Kawsar Mahmud<br>CEO and Founder, Aevora Media</p>

    <p style="margin: 28px 0 0 0; font-size: 11px; color: #888888;">If you'd prefer not to hear from me, <a href="{{ UnsubscribeURL }}" style="color: #777777;">unsubscribe here</a> or <a href="{{ UnsubscribeURL }}?manage=true" style="color: #777777;">manage preferences</a>.</p>
  </div>
</body>
</html>
